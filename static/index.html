<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><title>Vocal Cleaner</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#fff;--fg:#1b1d22;--card:#f1f3f6;--ac:#2b6cff}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--fg:#e8eaee;--card:#21242b}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
h1{font-size:20px;margin:0 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;align-items:center}
button,select{background:var(--card);color:var(--fg);border:1px solid #8884;border-radius:6px;padding:6px 10px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border:0}
#wf{width:100%;height:200px;background:var(--card);border-radius:8px;cursor:crosshair;display:block}
.sg{background:var(--card);padding:6px 8px;border-radius:6px;margin:4px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
small{opacity:.7}
</style></head><body>
<h1>Vocal Cleaner</h1>
<div class="bar">
  <input type="file" id="f" multiple accept=".wav,.mp3,.flac,.zip,.vcleaner">
  <select id="vsel" title="Sångspår"></select>
  <button class="p" onclick="analyze()">Hitta förslag</button>
  <button class="p" id="save" onclick="saveWav()" disabled>Spara sångspår…</button>
  <button id="projectSave" onclick="saveProject()" disabled>Spara projekt…</button>
  <span id="saveStatus" role="status" aria-live="polite">Öppna ljudfiler för att börja.</span>
</div>
<canvas id="wf"></canvas>
<small>Dra = markera · klick = sätt position · hjul = zooma · Skift+hjul = panorera</small>
<div class="bar">
  <button onclick="playBtn()" id="pp">▶ Spela</button>
  <button onclick="stop()">■ Stopp</button>
  <button onclick="selPlay()">Spela markering</button>
  <label><input type="checkbox" onchange="loop=this.checked"> Loop markering</label>
  <button onclick="addEdit('mute')">Tysta</button>
  <button onclick="addEdit('fadein')">Fade-in</button>
  <button onclick="addEdit('fadeout')">Fade-out</button>
  <button onclick="undo()">Ångra</button><button onclick="redoE()">Gör om</button>
  <button onclick="ab()" id="abb">Visar: Redigerad</button>
</div>
<div id="sg"></div>
<script>
const $=s=>document.querySelector(s), ctx=new AudioContext();
let saving=false,savedEdits="[]",tracks={},projectSaved="{}";
let sid,names=[],bufs={},vocal,edits=[],redo=[],sel=null,sugg=[],view={a:0,b:1},srcs=[],playing=false,startT=0,startOff=0,loop=false,useEd=true,edBuf=null;

$("#f").onchange=async e=>{
  if(vocal&&projectDirty()&&!confirm("Öppna nya filer och lämna det nuvarande projektet? Osparade projektändringar försvinner."))return;
  stop();vocal=null;
  const fd=new FormData();[...e.target.files].forEach(f=>fd.append("files",f));
  const r=await fetch("/api/upload",{method:"POST",body:fd});
  if(!r.ok){alert("Uppladdning misslyckades");return}
  const j=await r.json();sid=j.sid;names=j.stems;bufs={};vocal=null;tracks=j.project?.tracks||{};projectSaved=projectFingerprint();
  for(const n of names)bufs[n]=await ctx.decodeAudioData(await(await fetch(`/api/stem/${sid}/${encodeURIComponent(n)}`)).arrayBuffer());
  const s=$("#vsel");s.replaceChildren(...names.map(n=>{const o=document.createElement("option");o.value=n;o.textContent=n;return o}));
  s.value=j.vocal||names[0];setVocal(s.value);
};
$("#vsel").onchange=e=>setVocal(e.target.value);
function stashTrack(){if(vocal)tracks[vocal]={edits:edits.slice(),redo:redo.slice(),savedEdits};}
function projectFingerprint(){return JSON.stringify(Object.keys(tracks).sort().filter(n=>tracks[n].edits?.length).map(n=>[n,tracks[n].edits]))}
function projectDirty(){stashTrack();return projectFingerprint()!==projectSaved}
function setVocal(n){
  stashTrack();stop();vocal=n;
  const state=tracks[n]||{edits:[],redo:[],savedEdits:"[]"};
  edits=state.edits.slice();redo=(state.redo||[]).slice();savedEdits=state.savedEdits||"[]";
  sel=null;sugg=[];view={a:0,b:bufs[n].duration};rebuild();renderSugg();draw();saveState();
}

function rebuild(){
  const b=bufs[vocal],sr=b.sampleRate;edBuf=ctx.createBuffer(b.numberOfChannels,b.length,sr);
  for(let c=0;c<b.numberOfChannels;c++){
    const y=edBuf.getChannelData(c);y.set(b.getChannelData(c));
    for(const e of edits){
      const a=Math.max(0,Math.round(e.start*sr)),z=Math.min(b.length,Math.round(e.end*sr)),n=z-a;if(n<=0)continue;
      if(e.kind=="fadein")for(let i=0;i<n;i++)y[a+i]*=i/n;
      else if(e.kind=="fadeout")for(let i=0;i<n;i++)y[a+i]*=1-i/n;
      else{const f=Math.min(Math.round(e.fade*sr),a,b.length-z);
        for(let i=0;i<f;i++){y[a-f+i]*=1-i/f;y[z+i]*=i/f}
        y.fill(0,a,z)}
    }
  }
}
function changed(){saveState();const was=playing,p=pos();rebuild();draw();if(was)play(p)}
function addEdit(kind,s=sel){if(!s||s[1]-s[0]<0.005)return;edits.push({kind,start:s[0],end:s[1],fade:0.01});redo=[];changed()}
function undo(){if(edits.length){redo.push(edits.pop());changed()}}
function redoE(){if(redo.length){edits.push(redo.pop());changed()}}
function ab(){useEd=!useEd;$("#abb").textContent="Visar: "+(useEd?"Redigerad":"Original");changed()}

// ---- uppspelning (alla stems synkade, bara sångspåret påverkas av redigeringar)
function pos(){
  if(!playing)return startOff;
  return Math.min(startOff+ctx.currentTime-startT,bufs[vocal].duration)}
function play(off,dur){
  stop(true);ctx.resume();const lp=loop&&sel&&dur===undefined;if(lp)off=sel[0];
  srcs=names.map(n=>{const s=ctx.createBufferSource();s.buffer=(n==vocal&&useEd)?edBuf:bufs[n];s.connect(ctx.destination);
    if(lp){s.loop=true;s.loopStart=sel[0];s.loopEnd=sel[1]}return s});
  srcs.forEach(s=>dur===undefined?s.start(0,off):s.start(0,off,dur));
  startT=ctx.currentTime;startOff=off;playing=true;tick()}
function stop(keep){
  if(keep&&playing)startOff=pos();
  srcs.forEach(s=>{try{s.stop()}catch{}});srcs=[];playing=false;if(!keep)startOff=0;
  $("#pp").textContent="▶ Spela";draw()}
function playBtn(){if(!vocal)return;if(playing){stop(true)}else{play(startOff);}$("#pp").textContent=playing?"❚❚ Paus":"▶ Spela"}
function selPlay(){if(sel)play(sel[0],sel[1]-sel[0])}
function tick(){draw();if(playing&&pos()<bufs[vocal].duration-0.01)requestAnimationFrame(tick);else if(playing&&!(loop&&sel))stop()}

// ---- vågform
function draw(){
  const c=$("#wf"),g=c.getContext("2d"),W=c.width=c.clientWidth,H=c.height=c.clientHeight;
  g.clearRect(0,0,W,H);if(!vocal)return;
  const buf=useEd?edBuf:bufs[vocal],d=buf.getChannelData(0),sr=buf.sampleRate,span=view.b-view.a,x=t=>(t-view.a)/span*W;
  sugg.forEach(s=>{g.fillStyle=s.state=="avvisad"?"#8883":s.state=="godkänd"?"#2a62":"#fb34";g.fillRect(x(s.start),0,x(s.end)-x(s.start),H)});
  if(sel){g.fillStyle="#4af5";g.fillRect(x(sel[0]),0,x(sel[1])-x(sel[0]),H)}
  g.fillStyle="#6a9cff";const step=Math.max(1,Math.floor(span*sr/W/48));
  for(let px=0;px<W;px++){
    const i0=Math.floor((view.a+px/W*span)*sr),i1=Math.floor((view.a+(px+1)/W*span)*sr);let mn=0,mx=0;
    for(let i=i0;i<i1&&i<d.length;i+=step){const v=d[i];if(v<mn)mn=v;if(v>mx)mx=v}
    g.fillRect(px,H/2-mx*H/2,1,Math.max(1,(mx-mn)*H/2))}
  g.fillStyle="#f55";g.fillRect(x(pos()),0,2,H);
  g.fillStyle="#888";g.font="11px sans-serif";g.fillText(view.a.toFixed(1)+"s",4,12);g.fillText(view.b.toFixed(1)+"s",W-44,12)}
const wf=$("#wf"),tAt=e=>view.a+e.offsetX/wf.clientWidth*(view.b-view.a);
let dragA=null,moved=false;
wf.onmousedown=e=>{if(!vocal)return;dragA=tAt(e);moved=false};
wf.onmousemove=e=>{if(dragA===null)return;moved=true;const t=tAt(e);sel=[Math.max(0,Math.min(dragA,t)),Math.min(bufs[vocal].duration,Math.max(dragA,t))];draw()};
window.onmouseup=()=>{if(dragA!==null&&!moved){sel=null;startOff=dragA;if(playing)play(dragA)}dragA=null;draw()};
wf.onwheel=e=>{e.preventDefault();if(!vocal)return;const D=bufs[vocal].duration,span=view.b-view.a;
  if(e.shiftKey){const s=span*0.1*Math.sign(e.deltaY);view.a=Math.max(0,Math.min(D-span,view.a+s));view.b=view.a+span}
  else{const t=tAt(e),k=e.deltaY>0?1.25:0.8,ns=Math.min(D,Math.max(0.05,span*k)),r=(t-view.a)/span;
    view.a=Math.max(0,Math.min(D-ns,t-r*ns));view.b=view.a+ns}
  draw()};
addEventListener("resize",draw);

// ---- förslag
async function analyze(){
  if(!vocal)return;const r=await fetch(`/api/analyze/${sid}/${encodeURIComponent(vocal)}`);
  sugg=(await r.json()).suggestions;renderSugg();draw();if(!sugg.length)alert("Inga förslag hittades.")}
function renderSugg(){
  $("#sg").innerHTML=sugg.map((s,i)=>`<div class="sg"><b>${s.start.toFixed(2)}–${s.end.toFixed(2)} s</b> ${s.desc}
  <small>säkerhet ~${Math.round(s.confidence*100)}% · ${s.state||"ny"}</small>
  <button onclick="goS(${i})">Lyssna</button><button onclick="accS(${i})">Godkänn (tysta)</button><button onclick="rejS(${i})">Avvisa</button></div>`).join("")}
function goS(i){const s=sugg[i];sel=[s.start,s.end];const pad=1.5;
  view={a:Math.max(0,s.start-pad*2),b:Math.min(bufs[vocal].duration,s.end+pad*2)};play(Math.max(0,s.start-pad),s.end-s.start+2*pad);draw()}
function accS(i){const s=sugg[i];if(s.state=="godkänd")return;s.state="godkänd";addEdit("mute",[s.start,s.end]);renderSugg()}
function rejS(i){sugg[i].state="avvisad";renderSugg();draw()}

function saveState(message){
  $("#save").disabled=!vocal||saving;$("#projectSave").disabled=!vocal||saving;
  $("#saveStatus").textContent=message||(JSON.stringify(edits)!==savedEdits?"Osparade ändringar":"Inga osparade ändringar");
}
async function saveWav(){
  if(!vocal||saving)return;
  if(!/Windows/i.test(navigator.userAgent)){await exportWav();return}
  saving=true;$("#vsel").disabled=true;$("#f").disabled=true;const snapshot=JSON.stringify(edits);saveState("Välj var sångspåret ska sparas…");
  try{
    const r=await fetch(`/api/save/${sid}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({stem:vocal,edits:JSON.parse(snapshot)})});
    if(!r.ok)throw new Error(await r.text());
    const j=await r.json();if(!j.cancelled){savedEdits=snapshot;saveState(JSON.stringify(edits)===snapshot?"Sparat: "+j.name:"Sparat. Det finns nya osparade ändringar.")}else saveState("Sparandet avbröts. Dina ändringar finns kvar.");
  }catch(e){saveState("Kunde inte spara: "+e.message)}finally{saving=false;$("#save").disabled=!vocal;$("#projectSave").disabled=!vocal;$("#vsel").disabled=false;$("#f").disabled=false}
}
async function saveProject(){
  if(!vocal||saving)return;
  stashTrack();const snapshot=JSON.stringify(tracks),fingerprint=projectFingerprint();saving=true;saveState("Sparar projekt…");
  $("#vsel").disabled=true;$("#f").disabled=true;
  try{
    const r=await fetch(`/api/project/${sid}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({version:1,tracks:JSON.parse(snapshot)})});
    if(!r.ok)throw new Error(await r.text());
    if(/Windows/i.test(navigator.userAgent)){
      const j=await r.json();if(j.cancelled){saveState("Sparandet avbröts.");return}
    }else{
      const a=document.createElement("a");a.href=URL.createObjectURL(await r.blob());a.download="Vocal-Cleaner.vcleaner";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    }
    projectSaved=fingerprint;saveState("Projekt sparat – alla stems och redigeringar finns kvar.");
  }catch(e){saveState("Kunde inte spara projekt: "+e.message)}finally{
    saving=false;$("#save").disabled=false;$("#projectSave").disabled=false;$("#vsel").disabled=false;$("#f").disabled=false;
  }
}
addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();saveWav()}});
addEventListener("beforeunload",e=>{if(projectDirty()){e.preventDefault();e.returnValue=""}});

// ---- export (nytt filnamn, originalet orört)
async function exportWav(){
  if(!vocal)return;const r=await fetch(`/api/export/${sid}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({stem:vocal,edits})});
  if(!r.ok){alert("Export misslyckades");return}
  const a=document.createElement("a");a.href=URL.createObjectURL(await r.blob());
  a.download=(r.headers.get("content-disposition")||"").match(/filename="?([^";]+)/)?.[1]||"cleaned.wav";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
</script></body></html>
