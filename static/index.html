<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><title>Vocal Cleaner</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#fff;--fg:#1b1d22;--card:#f1f3f6;--ac:#2b6cff}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--fg:#e8eaee;--card:#21242b}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
h1{font-size:20px;margin:0 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;align-items:center}
button,select{background:var(--card);color:var(--fg);border:1px solid #8884;border-radius:6px;padding:6px 10px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}input,textarea{font:inherit;color:var(--fg);background:var(--bg)}#editorPanel{background:var(--bg);padding-top:8px}#transport{position:sticky;bottom:8px;background:var(--bg);padding:8px;border:1px solid #8884;border-radius:8px;z-index:2}.meta-row{display:grid;grid-template-columns:minmax(130px,180px) 1fr auto;gap:8px;align-items:center;margin:6px 0}.meta-row textarea{min-height:32px;border:1px solid #8886;border-radius:5px;padding:5px;resize:vertical}.metadata{margin:10px 0;padding:8px;background:var(--card);border-radius:8px}.track header small{margin-left:8px}button.p{background:var(--ac);color:#fff;border:0}
.wave{width:100%;height:110px;background:var(--card);border-radius:8px;cursor:crosshair;display:block}
.sg{background:var(--card);padding:6px 8px;border-radius:6px;margin:4px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.track{margin:10px 0;border:2px solid transparent;border-radius:8px;padding:6px}.track.active{border-color:var(--ac)}.track.active .wave{height:170px}.track header{margin-bottom:5px}small{opacity:.7}
</style></head><body>
<h1>Vocal Cleaner</h1>
<div class="bar">
  <input type="file" id="f" multiple accept=".wav,.mp3,.flac,.zip,.vcleaner">
  <select id="vsel" title="Sångspår"></select>
  <button class="p" onclick="analyze()">Hitta förslag</button>
  <button class="p" id="save" onclick="saveWav()" disabled>Spara valt spår…</button>
  <button id="projectSave" onclick="saveProject()" disabled>Spara projekt…</button>
  <span id="saveStatus" role="status" aria-live="polite">Öppna ljudfiler för att börja.</span>
</div>
<small id="memory"></small>
<div id="tracks"><canvas class="wave" id="wf"></canvas></div>
<div id="editorPanel">
<small id="activeName"></small><br>
<small>Dra = markera · klick = sätt position · hjul = zooma · Skift+hjul = panorera</small>
<div class="bar" id="transport">
  <button onclick="playBtn()" id="pp">▶ Spela</button>
  <button onclick="stop()">■ Stopp</button>
  <button onclick="selPlay()">Spela markering</button>
  <label><input type="checkbox" onchange="loop=this.checked"> Loop markering</label>
  <button onclick="addEdit('mute')">Tysta</button>
  <button onclick="addEdit('fadein')">Fade-in</button>
  <button onclick="addEdit('fadeout')">Fade-out</button>
  <button onclick="undo()">Ångra</button><button onclick="redoE()">Gör om</button>
  <button onclick="ab()" id="abb">Visar: Redigerad</button>
</div>
<details class="metadata" id="metadataPanel"><summary>Metadata för valt spår</summary>
<p id="metaSummary"></p><div id="metaFields"></div>
<div class="bar"><select id="metaKey" aria-label="Nytt metadatafält"></select><button onclick="addMetadata()">Lägg till fält</button><button onclick="clearMetadata()">Rensa metadata</button><button onclick="resetMetadata()">Återställ från original</button></div>
<small>Ändringarna gäller den exporterade WAV-filen och sparas i projektet. Fält som stöds av WAV följer med vid export. Originalfilen behålls.</small>
</details>
<div id="sg"></div></div>
<script>
const $=s=>document.querySelector(s), ctx=new AudioContext();
const editorPanel=$("#editorPanel");
const trackCanvases=new Map(),peakCache=new Map(),editedBuffers=new Map();
let metaInfo={};
let saving=false,savedEdits="[]",tracks={},projectSaved="{}";
let sid,names=[],bufs={},vocal,edits=[],redo=[],sel=null,sugg=[],view={a:0,b:1},srcs=[],playing=false,startT=0,startOff=0,loop=false,useEd=true,edBuf=null;

$("#f").onchange=async e=>{
  if(vocal&&projectDirty()&&!confirm("Öppna nya filer och lämna det nuvarande projektet? Osparade projektändringar försvinner."))return;
  stop();vocal=null;
  const fd=new FormData();[...e.target.files].forEach(f=>fd.append("files",f));
  const r=await fetch("/api/upload",{method:"POST",body:fd});
  if(!r.ok){alert("Uppladdning misslyckades");return}
  const j=await r.json();sid=j.sid;names=j.stems;bufs={};metaInfo={};vocal=null;tracks=j.project?.tracks||{};projectSaved=projectFingerprint();
  for(const n of names)bufs[n]=await ctx.decodeAudioData(await(await fetch(`/api/stem/${sid}/${encodeURIComponent(n)}`)).arrayBuffer());
  await Promise.all(names.map(async n=>{try{const r=await fetch(`/api/metadata/${sid}/${encodeURIComponent(n)}`);if(!r.ok)throw new Error(await r.text());metaInfo[n]=await r.json()}catch(e){metaInfo[n]={error:e.message,fields:[],pictures:0,binary:0}}}));
  names.sort(compareStems);
  const s=$("#vsel");s.replaceChildren(...names.map(n=>{const o=document.createElement("option");o.value=n;o.textContent=n;return o}));
  editedBuffers.clear();buildTracks();s.value=j.vocal||names[0];setVocal(s.value);
  $("#memory").textContent=`${names.length} stems · avkodat ljud cirka ${Math.round(Object.values(bufs).reduce((sum,b)=>sum+b.length*b.numberOfChannels*4,0)/1048576)} MB`;
};
$("#vsel").onchange=e=>setVocal(e.target.value);
function stashTrack(){if(vocal)tracks[vocal]={...tracks[vocal],edits:edits.slice(),redo:redo.slice(),savedEdits};}
function projectFingerprint(){return JSON.stringify(Object.keys(tracks).sort().filter(n=>tracks[n].edits?.length||tracks[n].metadata).map(n=>[n,tracks[n].edits||[],tracks[n].metadata||null]))}
function audioFingerprint(){return tracks[vocal]?.metadata?JSON.stringify({edits,metadata:tracks[vocal].metadata}):JSON.stringify(edits)}
function projectDirty(){stashTrack();return projectFingerprint()!==projectSaved}
function setVocal(n){
  const switching=!!vocal;stashTrack();stop();vocal=n;
  const state=tracks[n]||{edits:[],redo:[],savedEdits:"[]"};
  edits=state.edits.slice();redo=(state.redo||[]).slice();savedEdits=state.savedEdits||"[]";
  sel=null;sugg=[];if(!switching)view={a:0,b:projectDuration()};
  wf=trackCanvases.get(n)||wf;$("#vsel").value=n;
  for(const [name,c] of trackCanvases)c.parentElement.classList.toggle("active",name===n);
  const row=trackCanvases.get(n)?.parentElement;if(row)row.append(editorPanel);
  $("#activeName").textContent="Aktivt spår: "+n;
  renderMetadata();rebuild();renderSugg();draw();saveState();
}

function editedBuffer(name){
  const ops=name===vocal?edits:tracks[name]?.edits||[],b=bufs[name],key=JSON.stringify(ops);
  if(!ops.length){editedBuffers.delete(name);return b}
  const cached=editedBuffers.get(name);if(cached?.key===key&&cached.original===b)return cached.buffer;
  const buffer=ctx.createBuffer(b.numberOfChannels,b.length,b.sampleRate),sr=b.sampleRate;
  for(let c=0;c<b.numberOfChannels;c++){
    const y=buffer.getChannelData(c);y.set(b.getChannelData(c));
    for(const e of ops){
      const a=Math.max(0,Math.round(e.start*sr)),z=Math.min(b.length,Math.round(e.end*sr)),n=z-a;if(n<=0)continue;
      if(e.kind==="fadein")for(let i=0;i<n;i++)y[a+i]*=i/n;
      else if(e.kind==="fadeout")for(let i=0;i<n;i++)y[a+i]*=1-i/n;
      else{const f=Math.min(Math.round(e.fade*sr),a,b.length-z);
        for(let i=0;i<f;i++){y[a-f+i]*=1-i/f;y[z+i]*=i/f}y.fill(0,a,z)
      }
    }
  }
  editedBuffers.set(name,{key,original:b,buffer});return buffer;
}
function rebuild(){edBuf=editedBuffer(vocal)}
function changed(){saveState();const was=playing,p=pos();rebuild();draw();if(was)play(p)}
function addEdit(kind,s=sel){if(!s||s[1]-s[0]<0.005)return;edits.push({kind,start:s[0],end:s[1],fade:0.01});redo=[];changed()}
function undo(){if(edits.length){redo.push(edits.pop());changed()}}
function redoE(){if(redo.length){edits.push(redo.pop());changed()}}
function ab(){useEd=!useEd;$("#abb").textContent="Visar: "+(useEd?"Redigerad":"Original");changed()}

// ---- uppspelning (alla stems synkade, bara sångspåret påverkas av redigeringar)
function pos(){
  if(!playing)return startOff;
  return Math.min(startOff+ctx.currentTime-startT,bufs[vocal].duration)}
function play(off,dur){
  stop(true);ctx.resume();const lp=loop&&sel&&dur===undefined;if(lp)off=sel[0];
  srcs=names.filter(n=>off<bufs[n].duration).map(n=>{const s=ctx.createBufferSource();s.buffer=useEd?editedBuffer(n):bufs[n];s.connect(ctx.destination);
    if(lp){s.loop=true;s.loopStart=sel[0];s.loopEnd=sel[1]}return s});
  srcs.forEach(s=>dur===undefined?s.start(0,off):s.start(0,off,dur));
  startT=ctx.currentTime;startOff=off;playing=true;tick()}
function stop(keep){
  if(keep&&playing)startOff=pos();
  srcs.forEach(s=>{try{s.stop()}catch{}});srcs=[];playing=false;if(!keep)startOff=0;
  $("#pp").textContent="▶ Spela";draw()}
function playBtn(){if(!vocal)return;if(playing){stop(true)}else{play(startOff);}$("#pp").textContent=playing?"❚❚ Paus":"▶ Spela"}
function selPlay(){if(sel)play(sel[0],sel[1]-sel[0])}
function tick(){draw();if(playing&&pos()<bufs[vocal].duration-0.01)requestAnimationFrame(tick);else if(playing&&!(loop&&sel))stop()}

// ---- vågform
const categories=[
  [/back(?:ing)?\s*(?:vocal|vox)|background\s*(?:vocal|vox)|bakgrunds|harmony|choir|\bbgv\b/i,1,"Bakgrundssång"],
  [/lead\s*(?:vocal|vox)|vocal|\bvox\b|sång/i,0,"Huvudsång"],
  [/drum|trumm/i,2,"Trummor"],[/percussion|slagverk/i,3,"Percussion"],
  [/bass|\bbas\b/i,4,"Bas"],[/guitar|gitarr/i,5,"Gitarr"],
  [/piano|keyboard|keys|klaviatur/i,6,"Klaviatur"],[/synth/i,7,"Synth"],
  [/string|stråk/i,8,"Stråkar"],[/brass|wind|blås/i,9,"Blås"],[/\bfx\b|effect|effekt/i,10,"Effekter"]
];
function stemCategory(name){
  const normalized=name.replace(/[_-]+/g," ");
  let match=categories.find(([r])=>r.test(normalized));
  if(!match){const title=(metaInfo[name]?.fields||[]).find(f=>f.key==="TrackTitle")?.value||"";match=categories.find(([r])=>r.test(title))}
  return {rank:match?.[1]??11,label:match?.[2]??"Övrigt"};
}
function compareStems(a,b){
  const category=stemCategory(a).rank-stemCategory(b).rank;if(category)return category;
  return a.localeCompare(b,"sv",{numeric:true,sensitivity:"base"});
}
const metadataLabels={TrackTitle:"Titel",TrackArtist:"Artist",AlbumTitle:"Album",AlbumArtist:"Albumartist",RecordingDate:"År / datum",Genre:"Genre",TrackNumber:"Spårnummer",DiscNumber:"Skivnummer",Comment:"Kommentar",CopyrightMessage:"Copyright",EncoderSoftware:"Programvara",EncodedBy:"Kodad av",Isrc:"ISRC",UnsyncLyrics:"Låttext"};
function metadataFields(){return tracks[vocal]?.metadata?.fields||(metaInfo[vocal]?.fields||[]).filter(f=>f.editable).map(({key,value})=>({key,value}))}
function setMetadata(fields,clear=tracks[vocal]?.metadata?.clear||false){
  if(!vocal||saving)return;stashTrack();tracks[vocal].metadata={fields:fields.map(({key,value})=>({key,value})),clear};saveState();
}
function renderMetadata(){
  const info=metaInfo[vocal]||{fields:[],pictures:0,binary:0},override=tracks[vocal]?.metadata;
  $("#metaSummary").textContent=info.error?"Metadata kunde inte läsas: "+info.error:
    `${info.fields.length} textfält · ${info.pictures} inbäddade bilder · ${info.binary} binära fält`+(override?.clear?". Originalmetadata rensas vid export.":"");
  $("#metaFields").replaceChildren();
  for(const [i,f] of metadataFields().entries()){
    const row=document.createElement("div");row.className="meta-row";
    const label=document.createElement("label"),input=document.createElement("textarea"),remove=document.createElement("button");
    input.id="metadata-"+i;label.htmlFor=input.id;label.textContent=metadataLabels[f.key]||f.key;
    input.value=f.value;input.rows=f.value.includes("\n")?3:1;
    input.oninput=()=>{const fields=metadataFields().map(f=>({...f}));fields[i].value=input.value;setMetadata(fields)};
    remove.textContent="Ta bort";remove.onclick=()=>{const fields=metadataFields().slice();fields.splice(i,1);setMetadata(fields);renderMetadata()};
    row.append(label,input,remove);$("#metaFields").append(row);
  }
  for(const f of info.fields.filter(f=>!f.editable)){
    const p=document.createElement("p");p.textContent=`${f.key}: ${f.value} (visas endast; kan inte skrivas till WAV)`;$("#metaFields").append(p);
  }
  $("#metaKey").replaceChildren(...Object.entries(metadataLabels).map(([key,label])=>{const o=document.createElement("option");o.value=key;o.textContent=label;return o}));
}
function addMetadata(){if(!vocal||saving)return;const fields=metadataFields().slice();fields.push({key:$("#metaKey").value,value:""});setMetadata(fields);renderMetadata();$("#metadataPanel").open=true}
function clearMetadata(){if(!vocal||saving)return;setMetadata([],true);renderMetadata()}
function resetMetadata(){if(!vocal||saving)return;stashTrack();delete tracks[vocal].metadata;renderMetadata();saveState()}

function projectDuration(){return Math.max(0,...Object.values(bufs).map(b=>b.duration))}
function buildTracks(){
  trackCanvases.clear();peakCache.clear();$("#tracks").replaceChildren();
  for(const n of names){
    const row=document.createElement("section");row.className="track";
    const label=document.createElement("header"),button=document.createElement("button");
    button.textContent=n;button.onclick=()=>{if(!saving)setVocal(n)};label.append(button);const category=document.createElement("small");category.textContent=stemCategory(n).label;label.append(category);row.append(label);
    const c=document.createElement("canvas");c.className="wave";c.title="Klicka eller dra för att redigera detta spår";
    c.onmousedown=e=>{if(saving)return;if(n!==vocal)setVocal(n);wf=c;mouseDown(e)};
    c.onmousemove=mouseMove;c.onwheel=wheel;row.append(c);$("#tracks").append(row);trackCanvases.set(n,c);
  }
}
function sampleGain(t,frame,sr,length){
  let gain=1;
  for(const e of t){
    const a=Math.max(0,Math.round(e.start*sr)),z=Math.min(length,Math.round(e.end*sr)),n=z-a;if(n<=0)continue;
    if(e.kind==="fadein"){if(frame>=a&&frame<z)gain*=(frame-a)/n}
    else if(e.kind==="fadeout"){if(frame>=a&&frame<z)gain*=1-(frame-a)/n}
    else{const f=Math.min(Math.round(e.fade*sr),a,length-z);
      if(frame>=a&&frame<z)gain=0;
      else if(f&&frame>=a-f&&frame<a)gain*=1-(frame-a+f)/f;
      else if(f&&frame>=z&&frame<z+f)gain*=(frame-z)/f;
    }
  }
  return gain;
}
function draw(){
  if(!vocal)return;
  const canvases=trackCanvases.size?[...trackCanvases]:[[vocal,wf]];
  for(const [name,c] of canvases){
    const g=c.getContext("2d"),W=c.width=c.clientWidth,H=c.height=c.clientHeight;
    g.clearRect(0,0,W,H);
    const buf=bufs[name],d=buf.getChannelData(0),sr=buf.sampleRate,span=view.b-view.a,x=t=>(t-view.a)/span*W;
    const ops=useEd?(name===vocal?edits:tracks[name]?.edits||[]):[];
    const key=JSON.stringify([view.a,view.b,W,ops]);let cache=peakCache.get(name);
    if(!cache||cache.key!==key||cache.buf!==buf){
      const peaks=new Float32Array(W*2),step=Math.max(1,Math.floor(span*sr/W/48));
      for(let px=0;px<W;px++){
        const i0=Math.floor((view.a+px/W*span)*sr),i1=Math.floor((view.a+(px+1)/W*span)*sr);let mn=0,mx=0;
        for(let i=i0;i<i1&&i<d.length;i+=step){const v=d[i]*sampleGain(ops,i,sr,buf.length);if(v<mn)mn=v;if(v>mx)mx=v}
        peaks[px*2]=mn;peaks[px*2+1]=mx;
      }
      cache={key,buf,peaks};peakCache.set(name,cache);
    }
    if(name===vocal){
      sugg.forEach(s=>{g.fillStyle=s.state==="avvisad"?"#8883":s.state==="godkänd"?"#2a62":"#fb34";g.fillRect(x(s.start),0,x(s.end)-x(s.start),H)});
      if(sel){g.fillStyle="#4af5";g.fillRect(x(sel[0]),0,x(sel[1])-x(sel[0]),H)}
    }
    g.fillStyle=name===vocal?"#6a9cff":"#8393ad";
    for(let px=0;px<W;px++){const mn=cache.peaks[px*2],mx=cache.peaks[px*2+1];g.fillRect(px,H/2-mx*H/2,1,Math.max(1,(mx-mn)*H/2))}
    g.fillStyle="#f55";g.fillRect(x(pos()),0,2,H);
    g.fillStyle="#888";g.font="11px sans-serif";g.fillText(view.a.toFixed(1)+"s",4,12);g.fillText(view.b.toFixed(1)+"s",W-44,12);
  }
}
let wf=$("#wf");const tAt=e=>view.a+e.offsetX/(e.currentTarget||wf).clientWidth*(view.b-view.a);
let dragA=null,moved=false;
function mouseDown(e){if(!vocal)return;dragA=tAt(e);moved=false};
function mouseMove(e){if(dragA===null)return;moved=true;const t=tAt(e);sel=[Math.max(0,Math.min(dragA,t)),Math.min(bufs[vocal].duration,Math.max(dragA,t))];draw()};
window.onmouseup=()=>{if(dragA!==null&&!moved){sel=null;startOff=dragA;if(playing)play(dragA)}dragA=null;draw()};
function wheel(e){e.preventDefault();if(!vocal)return;const D=projectDuration(),span=view.b-view.a;
  if(e.shiftKey){const s=span*0.1*Math.sign(e.deltaY);view.a=Math.max(0,Math.min(D-span,view.a+s));view.b=view.a+span}
  else{const t=tAt(e),k=e.deltaY>0?1.25:0.8,ns=Math.min(D,Math.max(0.05,span*k)),r=(t-view.a)/span;
    view.a=Math.max(0,Math.min(D-ns,t-r*ns));view.b=view.a+ns}
  draw()};
wf.onmousedown=mouseDown;wf.onmousemove=mouseMove;wf.onwheel=wheel;
addEventListener("resize",draw);

// ---- förslag
async function analyze(){
  if(!vocal)return;const r=await fetch(`/api/analyze/${sid}/${encodeURIComponent(vocal)}`);
  sugg=(await r.json()).suggestions;renderSugg();draw();if(!sugg.length)alert("Inga förslag hittades.")}
function renderSugg(){
  $("#sg").innerHTML=sugg.map((s,i)=>`<div class="sg"><b>${s.start.toFixed(2)}–${s.end.toFixed(2)} s</b> ${s.desc}
  <small>säkerhet ~${Math.round(s.confidence*100)}% · ${s.state||"ny"}</small>
  <button onclick="goS(${i})">Lyssna</button><button onclick="accS(${i})">Godkänn (tysta)</button><button onclick="rejS(${i})">Avvisa</button></div>`).join("")}
function goS(i){const s=sugg[i];sel=[s.start,s.end];const pad=1.5;
  view={a:Math.max(0,s.start-pad*2),b:Math.min(bufs[vocal].duration,s.end+pad*2)};play(Math.max(0,s.start-pad),s.end-s.start+2*pad);draw()}
function accS(i){const s=sugg[i];if(s.state=="godkänd")return;s.state="godkänd";addEdit("mute",[s.start,s.end]);renderSugg()}
function rejS(i){sugg[i].state="avvisad";renderSugg();draw()}

function saveState(message){
  if(window.ipc)window.ipc.postMessage(projectDirty()?"dirty":"clean");
  $("#save").disabled=!vocal||saving;$("#projectSave").disabled=!vocal||saving;
  $("#saveStatus").textContent=message||(audioFingerprint()!==savedEdits?"Osparade ändringar":"Inga osparade ändringar");
}
async function saveWav(){
  if(!vocal||saving)return;
  if(!/Windows/i.test(navigator.userAgent)){await exportWav();return}
  saving=true;$("#vsel").disabled=true;$("#f").disabled=true;const snapshot=JSON.stringify(edits),metadata=tracks[vocal]?.metadata,signature=audioFingerprint();saveState("Välj var spåret ska sparas…");
  try{
    const r=await fetch(`/api/save/${sid}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({stem:vocal,edits:JSON.parse(snapshot),metadata})});
    if(!r.ok)throw new Error(await r.text());
    const j=await r.json();if(!j.cancelled){savedEdits=signature;saveState(audioFingerprint()===signature?"Sparat: "+j.name:"Sparat. Det finns nya osparade ändringar.")}else saveState("Sparandet avbröts. Dina ändringar finns kvar.");
  }catch(e){saveState("Kunde inte spara: "+e.message)}finally{saving=false;$("#save").disabled=!vocal;$("#projectSave").disabled=!vocal;$("#vsel").disabled=false;$("#f").disabled=false}
}
async function saveProject(){
  if(!vocal||saving)return;
  stashTrack();const snapshot=JSON.stringify(tracks),fingerprint=projectFingerprint();saving=true;saveState("Sparar projekt…");
  $("#vsel").disabled=true;$("#f").disabled=true;
  try{
    const r=await fetch(`/api/project/${sid}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({version:2,tracks:JSON.parse(snapshot)})});
    if(!r.ok)throw new Error(await r.text());
    if(/Windows/i.test(navigator.userAgent)){
      const j=await r.json();if(j.cancelled){saveState("Sparandet avbröts.");return}
    }else{
      const a=document.createElement("a");a.href=URL.createObjectURL(await r.blob());a.download="Vocal-Cleaner.vcleaner";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    }
    projectSaved=fingerprint;saveState(projectDirty()?"Projekt sparat. Det finns nya osparade ändringar.":"Projekt sparat – alla stems och redigeringar finns kvar.");
  }catch(e){saveState("Kunde inte spara projekt: "+e.message)}finally{
    saving=false;$("#save").disabled=false;$("#projectSave").disabled=false;$("#vsel").disabled=false;$("#f").disabled=false;
  }
}
addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();saveWav()}});
addEventListener("beforeunload",e=>{if(projectDirty()){e.preventDefault();e.returnValue=""}});

// ---- export (nytt filnamn, originalet orört)
async function exportWav(){
  if(!vocal)return;const r=await fetch(`/api/export/${sid}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({stem:vocal,edits,metadata:tracks[vocal]?.metadata})});
  if(!r.ok){alert("Export misslyckades");return}
  const a=document.createElement("a");a.href=URL.createObjectURL(await r.blob());
  a.download=(r.headers.get("content-disposition")||"").match(/filename="?([^";]+)/)?.[1]||"cleaned.wav";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
</script></body></html>
