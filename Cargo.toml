[package]
name = "vocal-cleaner"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["mp3", "flac", "wav", "pcm"] }
hound = "3"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
open = "5"

[profile.release]
opt-level = 3
lto = true
strip = true
