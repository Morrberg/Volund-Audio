[package]
name = "volund-audio"
version = "0.8.0"
edition = "2021"
description = "Völund Audio — local stem editor, mixing and mastering"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["mp3", "flac", "wav", "pcm"] }
hound = "3"
ebur128 = "0.1.10"
lofty = "0.25"
zip = { version = "2.2.0", default-features = false, features = ["deflate"] }
open = "5"
tower-http = { version = "0.6", features = ["cors"] }

# Tauri is the desktop shell on Linux, Windows and macOS. FreeBSD keeps the
# browser-based fallback until its WebKit/GTK packaging can be verified.
[target.'cfg(not(target_os = "freebsd"))'.dependencies]
tauri = { version = "2" }
tauri-plugin-dialog = "2"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = true
strip = true

[build-dependencies]
tauri-build = { version = "2" }
