name: Völund Audio - Windows Build

on:
  push:
    branches: [main, 'port/**']
  pull_request:
    branches: [main, 'port/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tauri-platform-builds:
    name: Tauri build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Test Rust code
        run: cargo test --verbose
      - name: Build desktop application
        run: cargo build --release

  build-native-packages:
    name: Build ${{ matrix.platform }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            bundles: dmg
          - platform: Ubuntu
            os: ubuntu-24.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux desktop dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2"

      - name: Generate macOS app icon
        if: matrix.platform == 'macOS'
        run: |
          cargo tauri icon icons/icon.png --output target/tauri-icons
          cat > tauri.macos.conf.json <<'EOF'
          {
            "bundle": {
              "icon": [
                "target/volund-icon-rgba.png",
                "icons/icon.ico",
                "target/tauri-icons/icon.icns"
              ]
            }
          }
          EOF

      - name: Build native package
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Upload macOS package
        if: matrix.platform == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: Volund-Audio-macOS
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Upload Ubuntu packages
        if: matrix.platform == 'Ubuntu'
        uses: actions/upload-artifact@v6
        with:
          name: Volund-Audio-Ubuntu
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30

  test-linux:
    name: Test on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test editor persistence
        run: node --test tests/editor.test.cjs tests/repair.test.cjs
      - name: Run tests
        run: cargo test --verbose

  build-windows:
    name: Build Windows package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check out Demucs-RS
        uses: actions/checkout@v7
        with:
          repository: nikhilunni/demucs-rs
          ref: v0.3.4
          path: demucs-rs

      - name: Build release
        run: cargo build --release

      - name: Build optional Demucs-RS engine
        run: cargo build --release --locked --manifest-path demucs-rs/demucs-cli/Cargo.toml

      - name: Run Windows tests
        run: cargo test --release

      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install WebView test driver
        run: npm install --prefix target/ui-tools --no-save --ignore-scripts playwright-core@1.58.2
      - name: Test Windows editor UI
        run: node tests/desktop.e2e.cjs
      - name: Upload UI previews
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Volund-Audio-UI-Previews
          path: target/ui-*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Package Völund Audio and optional engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/package | Out-Null
          Copy-Item target/release/volund-audio.exe target/package/
          Copy-Item demucs-rs/target/release/demucs.exe target/package/
          Copy-Item demucs-rs/LICENSE target/package/LICENSE-demucs-rs.txt

      - name: Upload Windows package
        uses: actions/upload-artifact@v6
        with:
          name: Volund-Audio-Windows
          path: target/package/
          if-no-files-found: error
          retention-days: 30
