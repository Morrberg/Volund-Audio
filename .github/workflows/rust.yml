name: Völund Audio - Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    name: Test on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test editor persistence
        run: node tests/editor.test.cjs
      - name: Run tests
        run: cargo test --verbose

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check out demucs-rs
        uses: actions/checkout@v4
        with:
          repository: nikhilunni/demucs-rs
          ref: v0.3.4
          path: demucs-rs

      - name: Build release
        run: cargo build --release

      - name: Build demucs-rs engine
        run: cargo build --release --locked --manifest-path demucs-rs/demucs-cli/Cargo.toml

      - name: Run Windows tests
        run: cargo test --release

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install WebView test driver
        run: npm install --prefix target/ui-tools --no-save --ignore-scripts playwright-core@1.58.2
      - name: Test Windows editor UI
        run: node tests/desktop.e2e.cjs
      - name: Upload UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Volund-Audio-UI-Previews
          path: target/ui-*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Package Völund Audio and optional engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/package | Out-Null
          Copy-Item target/release/volund-audio.exe target/package/
          Copy-Item demucs-rs/target/release/demucs.exe target/package/
          Copy-Item demucs-rs/LICENSE target/package/LICENSE-demucs-rs.txt

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Volund-Audio-Windows
          path: target/package/
          if-no-files-found: error
          retention-days: 30
