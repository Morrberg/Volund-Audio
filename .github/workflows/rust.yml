name: Völund Audio - Windows Build

on:
  push:
    branches: [main, 'port/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tauri-platform-builds:
    name: Tauri build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Test Rust code
        run: cargo test --verbose
      - name: Build desktop application
        run: cargo build --release

  test-linux:
    name: Test on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test editor persistence
        run: node tests/editor.test.cjs
      - name: Run tests
        run: cargo test --verbose

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Run Windows tests
        run: cargo test --release

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install WebView test driver
        run: npm install --prefix target/ui-tools --no-save --ignore-scripts playwright-core@1.58.2
      - name: Test Windows editor UI
        run: node tests/desktop.e2e.cjs
      - name: Upload UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Volund-Audio-UI-Previews
          path: target/ui-*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Volund-Audio-Windows
          path: target/release/volund-audio.exe
          if-no-files-found: error
          retention-days: 30
