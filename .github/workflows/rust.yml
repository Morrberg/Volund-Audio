name: Vocal Cleaner - Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    name: Test on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test editor persistence
        run: node tests/editor.test.cjs
      - name: Run tests
        run: cargo test --verbose

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Run Windows tests
        run: cargo test --release

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install WebView test driver
        run: npm install --prefix target/ui-tools --no-save --ignore-scripts playwright-core@1.58.2
      - name: Test native Windows UI
        run: node tests/desktop.e2e.cjs
      - name: Upload UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vocal-Cleaner-UI-Previews
          path: target/ui-*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Vocal-Cleaner-Windows
          path: target/release/vocal-cleaner.exe
          if-no-files-found: error
          retention-days: 30
